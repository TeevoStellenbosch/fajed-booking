<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FAJED — Book Your Chair</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f7f4ee; --white: #ffffff; --ink: #111111;
    --grey: #6b6b6b; --light-grey: #e5e2db; --gold: #b8945f;
    --green: #2e7d32; --green-soft: #e8f5e9;
    --red: #c62828; --red-soft: #fdecea;
    --amber: #f57c00; --amber-soft: #fff3e0;
  }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem 4rem; -webkit-font-smoothing: antialiased; }
  .app { width: 100%; max-width: 520px; }
  .header { text-align: center; margin-bottom: 1rem; }
  .logo-wrap { display: inline-flex; align-items: center; justify-content: center; width: 110px; height: 110px; margin-bottom: 1rem; }
  .logo-img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .logo-fallback { display: none; width: 90px; height: 90px; border-radius: 50%; background: var(--ink); color: var(--cream); font-size: 2.5rem; align-items: center; justify-content: center; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; font-weight: 400; letter-spacing: 6px; line-height: 1; color: var(--ink); margin-bottom: 0.35rem; }
  .est { font-size: 0.7rem; letter-spacing: 3px; font-weight: 700; color: var(--grey); text-transform: uppercase; margin-bottom: 0.5rem; }
  .tagline { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 4px; color: var(--gold); }
  .rule { height: 1px; background: var(--light-grey); margin: 1.5rem 0; position: relative; }
  .rule::after { content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); width: 40px; height: 7px; background: var(--cream); border-left: 1px solid var(--gold); border-right: 1px solid var(--gold); }
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 2px; color: var(--ink); margin-bottom: 0.75rem; display: flex; align-items: baseline; justify-content: space-between; }
  .section-title small { font-family: 'Inter', sans-serif; font-size: 0.7rem; letter-spacing: 1.5px; color: var(--grey); font-weight: 600; text-transform: uppercase; }
  .hours-card { background: var(--white); border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 1.75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .hours-card summary { cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; letter-spacing: 2px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .hours-card summary::-webkit-details-marker { display: none; }
  .hours-card summary::after { content: '+'; font-size: 1.3rem; color: var(--gold); }
  .hours-card[open] summary::after { content: '−'; }
  .hours-list { margin-top: 1rem; line-height: 1.9; font-size: 0.88rem; color: #444; }
  .hours-list .row { display: flex; justify-content: space-between; padding: 0.15rem 0; }
  .hours-list .day { color: var(--grey); font-weight: 500; }
  .hours-list .time { font-weight: 600; }
  .hours-list .closed { color: #bbb; text-decoration: line-through; font-weight: 400; }
  .date-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 0.6rem; display: block; }
  input[type="date"], input[type="text"], input[type="tel"], input[type="password"], input[type="number"] { width: 100%; padding: 1rem 1.1rem; font-size: 1.05rem; font-family: 'Inter', sans-serif; font-weight: 500; border: 1.5px solid var(--light-grey); border-radius: 12px; background: var(--white); color: var(--ink); transition: all 0.15s; -webkit-appearance: none; appearance: none; }
  input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }
  input::placeholder { color: #aaa; font-weight: 400; }
  input[type="date"] { font-weight: 600; cursor: pointer; }
  .slots-section { margin: 1.75rem 0 0.5rem; }
  .legend { display: flex; gap: 1.25rem; font-size: 0.75rem; color: var(--grey); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 0.85rem; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot.green { background: var(--green); }
  .dot.grey { background: #ccc; }
  .slot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.65rem; }
  .slot { position: relative; padding: 1rem 0.5rem 1.15rem; text-align: center; border-radius: 12px; border: 1.5px solid var(--light-grey); background: var(--white); color: var(--ink); user-select: none; transition: all 0.12s; overflow: hidden; }
  .slot-time { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 1.5px; line-height: 1; margin-bottom: 0.25rem; }
  .slot-duration { font-size: 0.7rem; color: var(--grey); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .slot.available { cursor: pointer; }
  .slot.available:hover { border-color: var(--green); background: var(--green-soft); transform: translateY(-2px); }
  .slot.available:active { transform: translateY(0); }
  .slot.available .slot-duration { color: var(--green); }
  .slot.taken { background: #f0eee9; color: #999; border-color: #ede9e0; cursor: not-allowed; padding-bottom: 1.65rem; }
  .slot.taken .slot-time { text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: 0.6; }
  .slot.taken .slot-duration { opacity: 0.5; }
  .slot.taken .booked-mark { position: absolute; bottom: 0; left: 0; right: 0; background: var(--red); color: var(--white); font-family: 'Bebas Neue', sans-serif; font-size: 0.7rem; letter-spacing: 1.5px; padding: 3px 0; text-align: center; font-weight: 400; }
  .slot.selected { background: var(--ink); color: var(--cream); border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
  .slot.selected .slot-duration { color: var(--gold); }
  .empty-msg { grid-column: 1 / -1; color: var(--grey); padding: 1.75rem 0; text-align: center; font-style: italic; font-size: 0.95rem; }
  .loading-slots { grid-column: 1 / -1; color: var(--grey); padding: 1.75rem 0; text-align: center; font-style: italic; font-size: 0.95rem; }
  .form-area { display: none; margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--light-grey); animation: fadeIn 0.3s ease; }
  .form-area.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .form-area .field-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px; display: block; margin-bottom: 0.5rem; }
  .selected-badge { display: inline-block; background: var(--ink); color: var(--cream); font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 2px; padding: 0.35rem 0.9rem; border-radius: 8px; margin-left: 0.4rem; vertical-align: middle; }
  .service-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px; display: block; margin: 1.5rem 0 0.6rem; }
  .service-label .special-tag { display: inline-block; background: var(--gold); color: var(--white); font-size: 0.65rem; letter-spacing: 1px; padding: 0.15rem 0.5rem; border-radius: 4px; margin-left: 0.4rem; vertical-align: middle; font-family: 'Inter', sans-serif; font-weight: 700; }
  .service-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .service-option { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 1rem; background: var(--white); border: 1.5px solid var(--light-grey); border-radius: 12px; cursor: pointer; transition: all 0.15s; }
  .service-option:hover { border-color: var(--gold); background: #fdfaf3; }
  .service-option.selected { border-color: var(--ink); background: var(--ink); color: var(--cream); }
  .service-option.selected .service-price { color: var(--gold); }
  .service-option.selected .service-desc { color: #ccc; }
  .service-info { flex: 1; text-align: left; }
  .service-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
  .service-desc { font-size: 0.72rem; color: var(--grey); font-style: italic; }
  .service-price { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 1px; color: var(--ink); white-space: nowrap; margin-left: 0.75rem; }
  .service-price .was { font-size: 0.9rem; color: #999; text-decoration: line-through; margin-right: 6px; letter-spacing: 0; }
  .total-bar { display: flex; justify-content: space-between; align-items: center; background: var(--cream); border: 1.5px dashed var(--gold); border-radius: 12px; padding: 1rem 1.25rem; margin-top: 1.25rem; }
  .total-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px; color: var(--grey); }
  .total-amount { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 1px; color: var(--ink); }
  button { width: 100%; padding: 1.1rem; margin-top: 0.5rem; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 3px; background: var(--ink); color: var(--cream); border: none; border-radius: 12px; cursor: pointer; transition: all 0.15s; }
  button:hover:not(:disabled) { background: var(--gold); color: var(--white); }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #msg { margin-top: 1rem; padding: 1rem 1.1rem; border-radius: 12px; font-weight: 600; font-size: 0.9rem; text-align: center; display: none; animation: fadeIn 0.3s ease; }
  #msg.show { display: block; }
  #msg.success { background: var(--green-soft); color: var(--green); border: 1px solid rgba(46, 125, 50, 0.25); }
  #msg.error { background: var(--red-soft); color: var(--red); border: 1px solid rgba(198, 40, 40, 0.25); }
  .policy-note { margin-top: 1rem; padding: 0.9rem 1rem; border-radius: 10px; background: var(--white); border: 1px solid var(--light-grey); font-size: 0.75rem; color: var(--grey); line-height: 1.5; }
  .policy-note strong { color: var(--ink); }
  .cancel-booking-link { display: block; text-align: center; margin-top: 2.5rem; color: var(--grey); font-size: 0.85rem; text-decoration: underline; cursor: pointer; letter-spacing: 0.5px; }
  .cancel-booking-link:hover { color: var(--ink); }
  .cancel-panel { display: none; margin-top: 1rem; background: var(--white); border-radius: 14px; padding: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .cancel-panel.show { display: block; }
  .cancel-panel h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px; margin-bottom: 0.5rem; }
  .cancel-hint { font-size: 0.82rem; color: var(--grey); margin-bottom: 1rem; }
  .cancel-hint + input { margin-bottom: 0.75rem; }
  .my-booking-row { padding: 0.85rem 0; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: 0.9rem; }
  .my-booking-row:last-child { border-bottom: none; }
  .my-booking-row .meta { color: var(--grey); font-size: 0.78rem; margin-top: 2px; }
  .my-booking-row .policy-tag { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.5px; padding: 0.15rem 0.5rem; border-radius: 4px; margin-top: 4px; text-transform: uppercase; }
  .my-booking-row .policy-tag.free { background: var(--green-soft); color: var(--green); }
  .my-booking-row .policy-tag.fee { background: var(--amber-soft); color: var(--amber); }
  .cancel-mine-btn { background: var(--red-soft); color: var(--red); border: none; padding: 0.5rem 0.9rem; border-radius: 8px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; width: auto; margin: 0; font-family: 'Inter', sans-serif; }
  .cancel-mine-btn:hover { background: #f9d7d4; }
  .admin-link { display: block; text-align: center; margin-top: 3rem; color: #aaa; font-size: 0.75rem; font-weight: 600; letter-spacing: 1.5px; text-decoration: none; text-transform: uppercase; }
  .admin-link:hover { color: var(--ink); }
  .admin-panel { display: none; margin-top: 1rem; background: var(--white); border-radius: 14px; padding: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .admin-panel.show { display: block; }
  .admin-panel h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px; margin-bottom: 1rem; color: var(--ink); }
  .admin-tabs { display: flex; gap: 0.2rem; margin-bottom: 1rem; border-bottom: 1px solid var(--light-grey); flex-wrap: wrap; }
  .admin-tab { flex: 1; min-width: 60px; padding: 0.6rem 0.2rem; cursor: pointer; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--grey); border-bottom: 2px solid transparent; transition: all 0.15s; text-align: center; background: none; border-radius: 0; margin: 0; font-family: 'Inter', sans-serif; }
  .admin-tab:hover { color: var(--ink); }
  .admin-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .admin-tab-content { display: none; }
  .admin-tab-content.active { display: block; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
  .stat-card { background: var(--cream); border-radius: 12px; padding: 0.85rem 1rem; border: 1px solid var(--light-grey); }
  .stat-card.highlight { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .stat-card.highlight .stat-label, .stat-card.highlight .stat-sub { color: #aaa; }
  .stat-card.highlight .stat-value { color: var(--gold); }
  .stat-label { font-size: 0.65rem; letter-spacing: 1.5px; color: var(--grey); text-transform: uppercase; font-weight: 700; margin-bottom: 0.35rem; }
  .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 1px; line-height: 1; color: var(--ink); }
  .stat-sub { font-size: 0.68rem; color: var(--grey); margin-top: 0.2rem; letter-spacing: 0.5px; }
  .popular-bar { background: linear-gradient(135deg, #fdfaf3, #f7f0e0); border: 1px solid var(--gold); border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
  .pop-label { color: var(--grey); font-weight: 600; letter-spacing: 0.5px; font-size: 0.7rem; text-transform: uppercase; }
  .pop-value { color: var(--ink); font-weight: 700; font-size: 0.85rem; text-align: right; }
  .booking-row { padding: 0.85rem 0; border-bottom: 1px solid var(--light-grey); display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: 0.9rem; }
  .booking-row:last-child { border-bottom: none; }
  .booking-row strong { font-size: 0.95rem; }
  .booking-row .meta { color: var(--grey); font-size: 0.78rem; margin-top: 2px; }
  .booking-row .svc { color: var(--gold); font-weight: 600; font-size: 0.78rem; margin-top: 2px; }
  .cancel-btn { background: var(--red-soft); color: var(--red); border: none; padding: 0.4rem 0.75rem; border-radius: 8px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; width: auto; margin: 0; font-family: 'Inter', sans-serif; }
  .cancel-btn:hover { background: #f9d7d4; }
  .edit-row { display: flex; gap: 0.5rem; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid var(--light-grey); flex-wrap: wrap; }
  .edit-row:last-child { border-bottom: none; }
  .edit-row label { flex: 1; min-width: 120px; font-size: 0.82rem; font-weight: 500; }
  .edit-row input { width: 80px; padding: 0.5rem 0.6rem; font-size: 0.9rem; text-align: center; }
  .edit-row .field-hint { font-size: 0.62rem; color: var(--grey); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .admin-save { margin-top: 1rem; padding: 0.9rem; font-size: 1.1rem; letter-spacing: 2px; }
  .login-form { padding: 1rem 0; }
  .login-form input { margin-bottom: 0.75rem; }
  .login-error { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; display: none; }
  .login-error.show { display: block; }
  .footer { text-align: center; margin-top: 3rem; font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; letter-spacing: 3px; color: #bbb; }

  .week-nav { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; background: var(--cream); border-radius: 12px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .week-nav button { width: 40px; height: 40px; padding: 0; margin: 0; font-size: 1.2rem; letter-spacing: 0; background: var(--ink); color: var(--cream); border-radius: 10px; font-family: 'Inter', sans-serif; flex-shrink: 0; }
  .week-nav button:hover { background: var(--gold); color: var(--white); }
  .week-nav .week-label { flex: 1; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; letter-spacing: 1.5px; color: var(--ink); line-height: 1.2; }
  .week-nav .week-label small { display: block; font-family: 'Inter', sans-serif; font-size: 0.68rem; letter-spacing: 0.5px; color: var(--grey); text-transform: uppercase; margin-top: 2px; }
  .week-hint { font-size: 0.72rem; color: var(--grey); text-align: center; margin-bottom: 1rem; font-style: italic; }
  .week-day-row { display: flex; gap: 0.5rem; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid var(--light-grey); }
  .week-day-row:last-of-type { border-bottom: none; }
  .week-day-row label { min-width: 85px; font-size: 0.82rem; font-weight: 600; color: var(--ink); flex-shrink: 0; }
  .week-day-row input { flex: 1; padding: 0.6rem 0.7rem; font-size: 0.85rem; border-radius: 8px; text-align: left; }
  .week-day-row .day-status { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 4px; flex-shrink: 0; }
  .week-day-row .day-status.closed { background: var(--red-soft); color: var(--red); }
  .week-day-row .day-status.open { background: var(--green-soft); color: var(--green); }
  .week-day-row.customized label::after { content: ' ●'; color: var(--gold); font-size: 0.7rem; }

  .popup-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; overflow: hidden; }
  .popup-overlay.show { opacity: 1; pointer-events: auto; }
  .popup-card { position: relative; z-index: 2; background: var(--cream); border-radius: 24px; padding: 2.5rem 2rem 2rem; text-align: center; max-width: 340px; width: 100%; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3); transform: translateY(40px) scale(0.95); opacity: 0; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease; }
  .popup-overlay.show .popup-card { transform: translateY(0) scale(1); opacity: 1; }
  .popup-check { width: 84px; height: 84px; margin: 0 auto 1.25rem; position: relative; }
  .popup-check::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--green-soft); transform: scale(0); z-index: 0; }
  .popup-overlay.show .popup-check::before { animation: pulseRing 0.6s ease-out 0.2s forwards; }
  @keyframes pulseRing { to { transform: scale(1.15); opacity: 0; } }
  .popup-check svg { width: 100%; height: 100%; position: relative; z-index: 1; }
  .check-circle { stroke: var(--green); stroke-width: 2.5; stroke-dasharray: 151; stroke-dashoffset: 151; stroke-linecap: round; }
  .check-mark { stroke: var(--green); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 48; stroke-dashoffset: 48; }
  .popup-overlay.show .check-circle { animation: drawCircle 0.5s ease-out forwards; }
  .popup-overlay.show .check-mark { animation: drawCheck 0.3s ease-out 0.45s forwards; }
  @keyframes drawCircle { to { stroke-dashoffset: 0; } }
  @keyframes drawCheck { to { stroke-dashoffset: 0; } }
  .popup-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--ink); margin-bottom: 0.35rem; opacity: 0; transform: translateY(8px); }
  .popup-sub { font-size: 0.95rem; font-weight: 600; color: var(--grey); margin-bottom: 0.35rem; opacity: 0; transform: translateY(8px); }
  .popup-service { font-size: 0.85rem; color: var(--gold); font-weight: 700; margin-bottom: 0.5rem; opacity: 0; transform: translateY(8px); }
  .popup-policy { font-size: 0.72rem; color: var(--grey); margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--light-grey); opacity: 0; transform: translateY(8px); line-height: 1.5; }
  .popup-hint { font-size: 0.7rem; color: #aaa; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600; opacity: 0; transform: translateY(8px); margin-top: 0.75rem; }
  .popup-overlay.show .popup-title { animation: fadeUp 0.4s ease-out 0.7s forwards; }
  .popup-overlay.show .popup-sub { animation: fadeUp 0.4s ease-out 0.85s forwards; }
  .popup-overlay.show .popup-service { animation: fadeUp 0.4s ease-out 0.95s forwards; }
  .popup-overlay.show .popup-policy { animation: fadeUp 0.4s ease-out 1.05s forwards; }
  .popup-overlay.show .popup-hint { animation: fadeUp 0.4s ease-out 1.5s forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .share-btn { background: #25d366; color: white; margin-top: 1.25rem; font-size: 1.05rem; letter-spacing: 1.5px; padding: 0.9rem; opacity: 0; transform: translateY(8px); }
